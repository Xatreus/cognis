[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognis-agent-evaluation"
version = "0.4.0"
description = "A reproducible evaluation and security-regression platform for AI agent endpoints"
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
  "fastapi>=0.162.0,<1.0",
  "uvicorn[standard]>=0.53.0,<1.0",
  "pydantic>=2.14.1,<3.0",
  "httpx>=0.28.1,<1.0",
  "python-dotenv>=1.2.4,<2.0",
  "docker>=7.2.0,<8.0",
  "psycopg[binary]>=3.3.6,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0,<10.0",
  "ruff>=0.16.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "examples*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
