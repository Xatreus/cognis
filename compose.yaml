services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cognis
      POSTGRES_USER: cognis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognis -d cognis"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["postgres"]

  cognis-api:
    build: .
    # Safe local default. For public deployments, place behind a TLS reverse
    # proxy and deliberately configure the bind address and network policy.
    ports:
      - "${COGNIS_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      COGNIS_ENV: ${COGNIS_ENV:-production}
      COGNIS_API_KEY: ${COGNIS_API_KEY:-}
      COGNIS_API_KEYS_JSON: ${COGNIS_API_KEYS_JSON:-}
      COGNIS_LOG_LEVEL: INFO
      COGNIS_DATABASE_URL: ${COGNIS_DATABASE_URL:-}
      COGNIS_DATABASE_PATH: /data/cognis.db
      COGNIS_CONTAINER_WORKER_IMAGE: cognis-agent-worker:latest
    volumes:
      - cognis-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    profiles: ["api"]

  # Opt-in only: mounting the Docker socket gives this API container control
  # over the host daemon. Use a dedicated worker host/daemon in production.
  cognis-api-with-docker-workers:
    build: .
    ports:
      - "${COGNIS_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      COGNIS_ENV: ${COGNIS_ENV:-production}
      COGNIS_API_KEY: ${COGNIS_API_KEY:-}
      COGNIS_API_KEYS_JSON: ${COGNIS_API_KEYS_JSON:-}
      COGNIS_LOG_LEVEL: INFO
      COGNIS_DATABASE_PATH: /data/cognis.db
      COGNIS_CONTAINER_WORKER_IMAGE: cognis-agent-worker:latest
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - cognis-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    profiles: ["docker-workers"]
    restart: unless-stopped

  cognis-worker-image:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: cognis-agent-worker:latest
    profiles: ["docker-workers"]

volumes:
  cognis-data:
  postgres-data:
