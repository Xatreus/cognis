name: CI

on:
  push:
    branches: [main, production-hardening, durable-evaluations, postgres-tenant-isolation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Upgrade installer
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit and API tests
        run: python -m pytest -q

      - name: Run recruiter demo and generate report
        run: python -m scripts.run_demo --output-dir reports

      - name: Upload demo reports
        if: matrix.python-version == '3.15'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cognis-demo-report
          path: |
            reports/demo-report.md
            reports/demo-report.json

  build-and-worker-smoke-test:
    name: Build images and smoke-test worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build API image
        run: docker build --pull -t cognis-api:ci -f Dockerfile .

      - name: Build worker image
        run: docker build --pull -t cognis-agent-worker:ci -f Dockerfile.worker .

      - name: Smoke-test isolated worker protocol
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            printf '%s\n' '{"protocol_version":1,"agent_id":"demo","input":"Order cancelled; customer requests refund"}' |
            docker run --rm -i \
              --network none \
              --read-only \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 64 \
              --memory 512m \
              --cpus 1 \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m \
              cognis-agent-worker:ci
          )"
          echo "$response"
          echo "$response" | grep -F '"ok":true'
          echo "$response" | grep -F '"output":"refund_eligible"'
